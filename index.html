<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Qur'an Digital Keluarga</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f0fdf4; }
        .arabic { font-family: 'Amiri', serif; font-size: 2.5rem; line-height: 4rem; text-align: right; }
        .card-doa:hover { transform: translateY(-5px); transition: 0.3s; }
    </style>
</head>
<body class="pb-20">

    <header class="bg-green-700 text-white p-6 shadow-lg text-center sticky top-0 z-50">
        <h1 class="text-2xl font-bold">Al-Qur'an & Doa Harian</h1>
        <p class="text-sm opacity-90">Khusus Untuk Bapak & Ibu</p>
    </header>

    <main class="max-w-3xl mx-auto p-4">
        
        <div class="flex bg-white rounded-lg shadow mb-6 overflow-hidden">
            <button onclick="showSection('quran')" class="flex-1 py-3 font-bold border-b-4 border-green-600 bg-green-50 text-green-800">Al-Qur'an</button>
            <button onclick="showSection('doa')" class="flex-1 py-3 font-bold text-gray-500 hover:bg-gray-50">Doa Pendek</button>
        </div>

        <section id="quran-section">
            <div id="surah-list" class="grid gap-3">
                <p class="text-center py-10">Memuat Al-Qur'an...</p>
            </div>
            <div id="ayat-view" class="hidden">
                <button onclick="backToList()" class="mb-4 text-green-700 font-bold flex items-center">
                    ← Kembali ke Daftar Surah
                </button>
                <div id="ayat-content" class="grid gap-6"></div>
            </div>
        </section>

        <section id="doa-section" class="hidden">
            <div id="doa-list" class="grid gap-4">
                <p class="text-center py-10">Memuat Doa-doa...</p>
            </div>
        </section>

    </main>

    <script>
        const surahContainer = document.getElementById('surah-list');
        const ayatView = document.getElementById('ayat-view');
        const ayatContent = document.getElementById('ayat-content');
        const doaContainer = document.getElementById('doa-list');

        // 1. Ambil Daftar Surah
        async function getSurah() {
            try {
                const res = await fetch('https://equran.id/api/v2/surat');
                const result = await res.json();
                surahContainer.innerHTML = '';
                result.data.forEach(s => {
                    surahContainer.innerHTML += `
                        <div onclick="getDetailSurah(${s.nomor})" class="bg-white p-4 rounded-xl shadow-sm border border-green-100 flex justify-between items-center cursor-pointer hover:bg-green-50">
                            <div>
                                <span class="bg-green-100 text-green-800 font-bold px-3 py-1 rounded-full text-sm mr-3">${s.nomor}</span>
                                <span class="font-bold text-lg">${s.namaLatin}</span>
                            </div>
                            <div class="text-right">
                                <p class="arabic text-xl text-green-700">${s.nama}</p>
                            </div>
                        </div>
                    `;
                });
            } catch (err) { surahContainer.innerHTML = 'Gagal memuat data. Periksa internet.'; }
        }

        // 2. Ambil Isi Ayat
        async function getDetailSurah(id) {
            surahContainer.classList.add('hidden');
            ayatView.classList.remove('hidden');
            ayatContent.innerHTML = '<p class="text-center">Membuka Surah...</p>';
            
            try {
                const res = await fetch(`https://equran.id/api/v2/surat/${id}`);
                const result = await res.json();
                const s = result.data;
                ayatContent.innerHTML = `<h2 class="text-2xl font-bold text-center text-green-800">${s.namaLatin}</h2>`;
                
                s.ayat.forEach(a => {
                    ayatContent.innerHTML += `
                        <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-green-500">
                            <p class="text-right text-green-800 font-bold mb-2">Ayat ${a.nomorAyat}</p>
                            <p class="arabic mb-4">${a.teksArab}</p>
                            <p class="text-gray-600 text-sm italic mb-2">${a.teksLatin}</p>
                            <p class="text-gray-800 font-medium">${a.teksIndonesia}</p>
                            <audio controls class="mt-4 w-full h-8">
                                <source src="${a.audio['01']}" type="audio/mpeg">
                            </audio>
                        </div>
                    `;
                });
            } catch (err) { ayatContent.innerHTML = 'Gagal memuat ayat.'; }
        }

        // 3. Ambil Doa
        async function getDoa() {
            try {
                const res = await fetch('https://open-api.my.id/api/doa');
                const result = await res.json();
                doaContainer.innerHTML = '';
                result.forEach(d => {
                    doaContainer.innerHTML += `
                        <div class="bg-white p-5 rounded-xl shadow-sm card-doa border border-green-50">
                            <h3 class="font-bold text-green-800 text-lg mb-3">${d.doa}</h3>
                            <p class="arabic text-2xl mb-4">${d.ayat}</p>
                            <p class="text-gray-700 text-sm leading-relaxed">${d.artinya}</p>
                        </div>
                    `;
                });
            } catch (err) { doaContainer.innerHTML = 'Gagal memuat doa.'; }
        }

        function showSection(type) {
            const btnQuran = document.querySelectorAll('button')[0];
            const btnDoa = document.querySelectorAll('button')[1];
            
            if(type === 'quran') {
                document.getElementById('quran-section').classList.remove('hidden');
                document.getElementById('doa-section').classList.add('hidden');
                btnQuran.className = "flex-1 py-3 font-bold border-b-4 border-green-600 bg-green-50 text-green-800";
                btnDoa.className = "flex-1 py-3 font-bold text-gray-500 hover:bg-gray-50";
            } else {
                document.getElementById('quran-section').classList.add('hidden');
                document.getElementById('doa-section').classList.remove('hidden');
                btnDoa.className = "flex-1 py-3 font-bold border-b-4 border-green-600 bg-green-50 text-green-800";
                btnQuran.className = "flex-1 py-3 font-bold text-gray-500 hover:bg-gray-50";
                getDoa();
            }
        }

        function backToList() {
            ayatView.classList.add('hidden');
            surahContainer.classList.remove('hidden');
            window.scrollTo(0,0);
        }

        // Jalankan saat pertama buka
        getSurah();
    </script>
</body>
</html>
